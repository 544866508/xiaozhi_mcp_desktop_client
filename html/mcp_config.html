
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MCP配置管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        }
        body {
            padding: 24px;
            background-color: #17181c;
            font-size: 14px;
            color: #e2e8f0;
        }
        /* 顶部按钮左右分栏布局 */
        .top-bar {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-right-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        button {
            font-size: 16px;
            padding: 10px 24px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }
        /* 主蓝色按钮 降低明度暗色版 */
        .btn-primary {
            background: linear-gradient(135deg, #2b64aa, #1f4e88);
            color: #fff;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #306fb9, #245899);
        }
        /* 次要按钮暗色模式 */
        .btn-normal {
            background: #2a2c33;
            color: #e2e8f0;
            border: 1px solid #3d4048;
        }
        .btn-normal:hover {
            background: #343740;
        }
        /* 危险删除按钮低亮度 */
        .btn-danger {
            background: linear-gradient(135deg, #993b3b, #7a2c2c);
            color: #fff;
        }
        .btn-danger:hover {
            background: linear-gradient(135deg, #aa4242, #883333);
        }
        /* 表格暗色美化 */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            background: #202228;
        }
        th,td {
            padding: 12px 14px;
            vertical-align: top;
            border-bottom: 1px solid #33363d;
            color: #cbd5e1;
        }
        th {
            background: linear-gradient(135deg, #2c2f36, #24262c);
            font-weight: 500;
            color: #e2e8f0;
        }
        tr:last-child td {
            border-bottom: none;
        }
        pre {
            white-space: pre;
            max-width: 320px;
            max-height: 140px;
            overflow: auto;
            margin:0;
            font-size:12px;
            background: #1a1c20;
            padding: 8px;
            border-radius: 6px;
            color: #a8b9d4;
        }
        /* 弹窗遮罩 磨砂暗色 */
        .mask {
            display: none;
            position: fixed;
            left:0;top:0;right:0;bottom:0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(3px);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .dialog {
            background: #202228;
            padding: 24px;
            width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .dialog h3 {
            font-size: 18px;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 20px;
            padding-left: 4px;
            border-left: 4px solid #367bc9;
        }
        /* 表单输入项暗色 */
        .form-item {
            margin: 16px 0;
        }
        .form-item label {
            display: block;
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        input, textarea {
            width:100%;
            padding: 12px 14px;
            border: 1px solid #3d4048;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: #1a1c20;
            color: #e2e8f0;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #367bc9;
            box-shadow: 0 0 0 3px rgba(54, 123, 201, 0.18);
        }
        textarea {
            min-height: 300px;
            font-family: monospace;
            margin: 10px 0;
            resize: none;
            white-space: pre;      /* 不自动折行，按原始代码行展示 */
            overflow-x: auto;      /* 开启横向滚动条 */
            overflow-y: auto;      /* 开启纵向滚动条 */
        }
        /* 弹窗按钮右对齐容器 */
        .dialog-btns {
            margin-top:20px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        #delTip {
            font-size: 16px;
            color: #e2e8f0;
            margin-bottom: 24px;
        }
        /* 自定义滚动条暗色适配 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1c20;
        }
        ::-webkit-scrollbar-thumb {
            background: #444852;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555a66;
        }

        /* 状态开关样式 */
        .switch-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .switch-text {
            font-size:13px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444852;
            transition: .3s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #367bc9;
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
    </style>
</head>
<body>
    <!-- 顶部布局：左侧返回按钮，右侧功能按钮组 -->
    <div class="top-bar">
        <button class="btn-normal" onclick="window.location.href='index.html'">
            <span>⮐</span> 返回主页
        </button>
        <div class="top-right-btns">
            <button class="btn-primary" onclick="openAddDialog()">
                <span>✛</span> 新增MCP工具
            </button>
            <button class="btn-normal" onclick="openBatchEdit()">
                <span>✎</span> 批量修改文本
            </button>
        </div>
    </div>

    <table id="mcpTable">
        <colgroup>
            <col style="width:20%">
            <col style="width:13%">
            <col style="width:12%">
            <col style="width:40%">
            <col style="width:15%">
        </colgroup>
        <thead>
            <tr>
                <th>MCP名称</th>
                <th>调用类型(type)</th>
                <th>状态</th>
                <th>描述(description)</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- 新增/编辑单行弹窗 -->
    <div class="mask" id="editMask">
        <div class="dialog">
            <h3 id="dialogTitle">新增MCP</h3>
            <div class="form-item">
                <textarea id="editJson" placeholder='{\n  "mcp-name": {\n    "type": "stdio",\n    "command": "",\n    "disabled": false\n  }\n}'></textarea>
            </div>

            <div class="dialog-btns">
                <button id="genIrCodeWrap" style="display:none;" class="btn-primary" onclick="genTerminalIrCode()">📟 生成终端控制代码</button>
                <button class="btn-primary" onclick="saveSingleMcp()">保存文本</button>
                <button class="btn-normal" onclick="closeEditMask()">取消</button>
            </div>
        </div>
    </div>

    <!-- 批量编辑完整文本弹窗 -->
    <div class="mask" id="batchMask">
        <div class="dialog">
            <h3>批量编辑文本 (mcp_config.json)</h3>
            <textarea id="batchJson"></textarea>
            <div class="dialog-btns">
                <button class="btn-primary" onclick="saveBatchJson()">原样保存并刷新</button>
                <button class="btn-normal" onclick="closeBatchMask()">取消</button>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="mask" id="delMask">
        <div class="dialog">
            <p id="delTip">确定删除该MCP配置？</p>
            <div class="dialog-btns">
                <button class="btn-danger" onclick="confirmDelete()">确认删除</button>
                <button class="btn-normal" onclick="closeDelMask()">取消</button>
            </div>
        </div>
    </div>

    <!-- irCtl结果弹窗 -->
    <div class="mask" id="irResultMask">
        <div class="dialog" style="width:700px;">
            <h3>irCtl 生成结果</h3>
            <pre id="irResultPre" style="max-height:400px;overflow:auto;min-width:650px;"></pre>
            <div class="dialog-btns">
                <button class="btn-primary" onclick="copyIrResult()">📋复制全部</button>
                <button class="btn-normal" onclick="closeIrResultMask()">关闭</button>
            </div>
        </div>
    </div>

<script src="mcpJsonOpt.js"></script>
<script>
let rawConfigText = ""; // 保存最原始的文本内容
let mcpData = {};       // 仅用于渲染表格的只读视图
let editTargetKey = null;

// 转义正则表达式特殊字符
function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// 在原始文本中按字符精确查找指定 MCP key 的位置区间
function getMcpBlockRange(text, key) {
    const mcpMatch = /"mcpServers"\s*:/.exec(text);
    if (!mcpMatch) return null;

    const searchStart = mcpMatch.index + mcpMatch[0].length;
    const keyRegex = new RegExp(`"${escapeRegExp(key)}"\\s*:`, 'g');
    keyRegex.lastIndex = searchStart;
    const match = keyRegex.exec(text);
    if (!match) return null;

    const startIdx = match.index;
    const braceStart = text.indexOf('{', startIdx + match[0].length);
    if (braceStart === -1) return null;

    let depth = 0;
    let braceEnd = -1;
    let inString = false;
    let escape = false;

    for (let i = braceStart; i < text.length; i++) {
        const char = text[i];
        if (escape) { escape = false; continue; }
        if (char === '\\') { escape = true; continue; }
        if (char === '"') { inString = !inString; continue; }
        if (!inString) {
            if (char === '{') depth++;
            else if (char === '}') {
                depth--;
                if (depth === 0) {
                    braceEnd = i;
                    break;
                }
            }
        }
    }

    if (braceEnd === -1) return null;
    return { start: startIdx, end: braceEnd + 1 };
}

// 将新 MCP 节点插入到 rawConfigText 的 mcpServers 内部
function insertNewMcpSnippet(text, snippet) {
    const mcpMatch = /"mcpServers"\s*:\s*\{/.exec(text);
    if (!mcpMatch) {
        return `{\n  "mcpServers": {\n${snippet}\n  }\n}`;
    }

    const startSearch = mcpMatch.index + mcpMatch[0].length;
    let depth = 1;
    let closingBraceIdx = -1;
    let inString = false;
    let escape = false;

    for (let i = startSearch; i < text.length; i++) {
        const char = text[i];
        if (escape) { escape = false; continue; }
        if (char === '\\') { escape = true; continue; }
        if (char === '"') { inString = !inString; continue; }
        if (!inString) {
            if (char === '{') depth++;
            else if (char === '}') {
                depth--;
                if (depth === 0) {
                    closingBraceIdx = i;
                    break;
                }
            }
        }
    }

    if (closingBraceIdx === -1) return text;

    const contentInside = text.substring(startSearch, closingBraceIdx).trim();
    const prefix = text.substring(0, closingBraceIdx);
    const suffix = text.substring(closingBraceIdx);

    if (contentInside.length > 0) {
        const needsComma = !/,\s*$/.test(contentInside);
        return prefix + (needsComma ? ",\n" : "\n") + snippet + "\n" + suffix;
    } else {
        return prefix + "\n" + snippet + "\n" + suffix;
    }
}

// 读取文本配置
async function loadConfig() {
    while (!window.pywebview) {
        await new Promise(resolve => setTimeout(resolve, 50));
    }
    try {
        rawConfigText = await window.pywebview.api.read_mcp_config();
        console.log("读取到原始配置文本：\n", rawConfigText);
        try {
            mcpData = JSON.parse(rawConfigText);
        } catch (e) {
            console.warn("文本仅作只读表格解析，可能包含自定义排版：", e);
            mcpData = { mcpServers: {} };
        }
        renderTable();
    } catch (err) {
        console.error("读取MCP配置失败：", err);
        alert("读取配置文件出错：" + err.message);
    }
}

document.addEventListener('DOMContentLoaded', loadConfig);

// 保持文本原样写回磁盘
async function saveRawConfig(text) {
    rawConfigText = text;
    try {
        mcpData = JSON.parse(text);
    } catch (e) {
        // 解析失败仅影响表格显示，不阻止文本原样写回
    }
    await window.pywebview.api.write_mcp_config(text);
}

// 切换启用/禁用状态（切片修改文本）
async function toggleMcpDisabled(name) {
    const range = getMcpBlockRange(rawConfigText, name);
    if (range) {
        let blockText = rawConfigText.substring(range.start, range.end);
        if (/"disabled"\s*:\s*true/.test(blockText)) {
            blockText = blockText.replace(/"disabled"\s*:\s*true/, '"disabled": false');
        } else if (/"disabled"\s*:\s*false/.test(blockText)) {
            blockText = blockText.replace(/"disabled"\s*:\s*false/, '"disabled": true');
        } else {
            const firstBrace = blockText.indexOf('{');
            if (firstBrace !== -1) {
                blockText = blockText.substring(0, firstBrace + 1) + '\n    "disabled": true,' + blockText.substring(firstBrace + 1);
            }
        }
        rawConfigText = rawConfigText.substring(0, range.start) + blockText + rawConfigText.substring(range.end);
        await saveRawConfig(rawConfigText);
    }
    renderTable();
}

// 渲染表格
function renderTable() {
    const tbody = document.querySelector("#mcpTable tbody");
    tbody.innerHTML = "";
    const servers = mcpData.mcpServers || {};
    for(const name of Object.keys(servers)){
        const item = servers[name] || {};
        const desc = item.description ?? "-";
        const isDisabled = item.disabled ?? false;
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${name}</td>
            <td>${item.type || "-"}</td>
            <td>
                <label class="switch-wrap">
                    <span class="switch-text">${isDisabled ? "禁用" : "启用"}</span>
                    <label class="switch">
                        <input type="checkbox" ${isDisabled ? "" : "checked"} onchange="toggleMcpDisabled('${name}')">
                        <span class="slider"></span>
                    </label>
                </label>
            </td>
            <td>${desc}</td>
            <td>
                <div style="width:150px;display:flex;gap:8px;align-items:center;">
                    <button class="btn-normal" style="padding:6px 12px;font-size:14px;gap:4px;" onclick="openEditDialog('${name}')">
                        <span>✎</span> 编辑
                    </button>
                    <button class="btn-danger" style="padding:6px 12px;font-size:14px;gap:4px;" onclick="openDelDialog('${name}')">
                        <span>🗑</span> 删除
                    </button>
                </div>
            </td>
        `;
        tbody.appendChild(tr);
    }
}

// 新增弹窗（最外层带括号，构成完整JSON）
function openAddDialog() {
    editTargetKey = null;
    document.getElementById("dialogTitle").innerText = "新增MCP工具";
    document.getElementById("editJson").value = `{\n  "mcp-name": {\n    "type": "stdio",\n    "command": "",\n    "disabled": false\n  }\n}`;
    document.getElementById("editMask").style.display = "flex";
    checkHasIrCtlField();
}

// 编辑单条 MCP：提取原始文本片段并包裹最外层括号
function openEditDialog(name) {
    editTargetKey = name;
    document.getElementById("dialogTitle").innerText = "编辑MCP";
    const range = getMcpBlockRange(rawConfigText, name);
    if (range) {
        const snippet = rawConfigText.substring(range.start, range.end);
        document.getElementById("editJson").value = `{\n  ${snippet}\n}`;
    } else {
        const tempWrap = {};
        if (mcpData.mcpServers && mcpData.mcpServers[name]) {
            tempWrap[name] = mcpData.mcpServers[name];
        }
        document.getElementById("editJson").value = JSON.stringify(tempWrap, null, 2);
    }
    document.getElementById("editMask").style.display = "flex";
    checkHasIrCtlField();
}

function closeEditMask(){
    document.getElementById("editMask").style.display = "none";
}

// 保存单条 MCP 文本：剥离最外层包裹的括号后插入 rawConfigText
async function saveSingleMcp() {
    while (!window.pywebview) {
        await new Promise(resolve => setTimeout(resolve, 50));
    }
    let rawInput = document.getElementById("editJson").value.trim();
    if (!rawInput) return;

    // ==========新增JSON格式校验开始==========
    try {
        // 先校验当前编辑框输入是否合法JSON
        JSON.parse(rawInput);
    } catch (parseErr) {
        alert(`JSON格式校验失败：\n${parseErr.message}\n请修正JSON语法后再保存`);
        return; // 格式错误直接终止保存流程
    }
    // ==========新增JSON格式校验结束==========

    // ========== 格式转换：调用 optimizeSingleMcpJson 将用户输入转为小智标准格式 ==========
    const optimizedObj = optimizeSingleMcpJson(rawInput);
    rawInput = JSON.stringify(optimizedObj, null, 2)
    // ========== 格式转换结束 ==========

    // ================= 开始：新增重名处理 =================
    if (!editTargetKey) {
        const matchKey = rawInput.match(/^\s*\{\s*"([^"]+)"\s*:/);
        if (matchKey) {
            let mcpName = matchKey[1];
            const existingKeys = mcpData.mcpServers ? Object.keys(mcpData.mcpServers) : [];

            // 使用你封装的安全命名函数
            let newName = getSafeNewMcpKey(existingKeys, mcpName);

            // 如果名字发生了改变，正则精确替换第一层的键名
            if (newName !== mcpName) {
                const keyRegex = new RegExp(`^(\\s*\\{\\s*)"${escapeRegExp(mcpName)}"(\\s*:)`);
                rawInput = rawInput.replace(keyRegex, `$1"${newName}"$2`);
            }
        }
    }
    // ================= 结束：新增重名处理 =================

    // 如果最外层有花括号，剥离最外层的 { 和 }，保留内部的 "key": { ... } 片段
    let snippet = rawInput;
    if (snippet.startsWith("{") && snippet.endsWith("}")) {
        snippet = snippet.substring(1, snippet.length - 1).trim();
    }

    if (editTargetKey) {
        const range = getMcpBlockRange(rawConfigText, editTargetKey);
        if (range) {
            rawConfigText = rawConfigText.substring(0, range.start) + snippet + rawConfigText.substring(range.end);
        } else {
            rawConfigText = insertNewMcpSnippet(rawConfigText, snippet);
        }
    } else {
        rawConfigText = insertNewMcpSnippet(rawConfigText, snippet);
    }

    await saveRawConfig(rawConfigText);
    closeEditMask();
    renderTable();
}

// 删除弹窗与处理
function openDelDialog(name) {
    editTargetKey = name;
    document.getElementById("delTip").innerText = `确定删除【${name}】配置吗？`;
    document.getElementById("delMask").style.display = "flex";
}
function closeDelMask(){
    document.getElementById("delMask").style.display = "none";
}
async function confirmDelete() {
    while (!window.pywebview) {
        await new Promise(resolve => setTimeout(resolve, 50));
    }
    const range = getMcpBlockRange(rawConfigText, editTargetKey);
    if (range) {
        let start = range.start;
        let end = range.end;

        const rest = rawConfigText.substring(end);
        const matchAfter = /^\s*,/.exec(rest);
        if (matchAfter) {
            end += matchAfter[0].length;
        } else {
            const before = rawConfigText.substring(0, start);
            const matchBefore = /,\s*$/.exec(before);
            if (matchBefore) {
                start -= matchBefore[0].length;
            }
        }

        rawConfigText = rawConfigText.substring(0, start) + rawConfigText.substring(end);
        await saveRawConfig(rawConfigText);
    }
    closeDelMask();
    renderTable();
}

// 批量修改文本弹窗
function openBatchEdit() {
    document.getElementById("batchJson").value = rawConfigText;
    document.getElementById("batchMask").style.display = "flex";
}
function closeBatchMask(){
    document.getElementById("batchMask").style.display = "none";
}
async function saveBatchJson() {
    while (!window.pywebview) {
        await new Promise(resolve => setTimeout(resolve, 50));
    }
    const txt = document.getElementById("batchJson").value;
    // 批量全局JSON校验
    try {
        JSON.parse(txt);
    } catch (e) {
        alert(`全局配置JSON格式错误：${e.message}`);
        return;
    }
    // ========== 格式转换：调用 optimizeSingleMcpJson 将用户输入转为小智标准格式 ==========
    const optimizedObj = optimizeSingleMcpJson(txt);
    const optimizedTxt = JSON.stringify(optimizedObj, null, 2)
    // ========== 格式转换结束 ==========
    await saveRawConfig(optimizedTxt);
    closeBatchMask();
    renderTable();
    alert("已按原始文本保存并刷新");
}

// 检测文本中是否包含 irCtl 关键字
function checkHasIrCtlField(){
    const wrap = document.getElementById("genIrCodeWrap");
    const txt = document.getElementById("editJson").value;
    if (txt.includes('irCtl')) {
        wrap.style.display = "block";
    } else {
        wrap.style.display = "none";
    }
}

document.getElementById("editJson").addEventListener("input", checkHasIrCtlField);

async function genTerminalIrCode(){
    const jsonStr = document.getElementById("editJson").value.trim();
    const resp = await window.pywebview.api.gen_terminal_ir_code(jsonStr);
    if(!resp.ok){
        alert("失败：" + resp.msg);
        return;
    }
    const preEl = document.getElementById("irResultPre");
    preEl.textContent = resp.ino_code;
    document.getElementById("irResultMask").style.display = "flex";
}

function closeIrResultMask(){
    document.getElementById("irResultMask").style.display = "none";
}

async function copyIrResult(){
    const text = document.getElementById("irResultPre").textContent;
    await navigator.clipboard.writeText(text);
    alert("已复制到剪贴板");
}
</script>
